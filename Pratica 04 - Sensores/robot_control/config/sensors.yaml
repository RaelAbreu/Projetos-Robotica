gps_to_xyz:
  ros__parameters:
    use_sim_time: true
    gps_topic: /gps/fix
    xyz_topic: /gps/xyz
    frame_id: map
    datum_lat: 38.161479
    datum_lon: -122.454630
    datum_alt: 0.0
    world_heading_deg: 180.0
    use_first_fix_as_datum: false    # true = o 1º fix (ruidoso!) vira a origem

imu_noise:
  ros__parameters:
    use_sim_time: true
    input_topic: /imu/data_raw
    output_topic: /imu/data
    orientation_std: 0.01            # rad (~0,6°) com noise_scale = 1
    noise_scale: 1.0                 # sobrescrito pelo launch (noise_scale * imu_noise)
    seed: -1                         # >=0 para ruído reprodutível

sensor_pose_estimator:
  ros__parameters:
    use_sim_time: true
    gps_xyz_topic: /gps/xyz
    imu_topic: /imu/data
    output_topic: /estimated_odom
    frame_id: map
    child_frame_id: chassis
    gps_alpha: 1.0                   # 1.0 = sem filtro; menor = suaviza (e atrasa)
    yaw_alpha: 1.0
