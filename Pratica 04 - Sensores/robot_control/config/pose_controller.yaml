pose_controller:            
  ros__parameters:
    use_sim_time: true
    odom_topic: /diff_drive_controller/odom
    cmd_vel_topic: /diff_drive_controller/cmd_vel_unstamped
    goal_topic: goal_pose
    control_rate: 50.0
    pos_tol: 0.05           
    yaw_tol: 0.05           
    v_max: 0.6              
    w_max: 1.5              
    rho:   {kp: 0.8,  ki: 0.0, kd: 0.0}
    alpha: {kp: 2.0,  ki: 0.0, kd: 0.0}
    beta:  {kp: -0.5, ki: 0.0, kd: 0.0}
    yaw:   {kp: 1.5,  ki: 0.0, kd: 0.0}    

pose_controller_3m:         
  ros__parameters:
    use_sim_time: true
    odom_topic: /diff_drive_controller/odom
    cmd_vel_topic: /diff_drive_controller/cmd_vel_unstamped
    goal_topic: goal_pose
    control_rate: 50.0
    pos_tol: 0.05
    yaw_tol: 0.05
    align_tol: 0.08         
    v_max: 0.6
    w_max: 1.5
    align:   {kp: 1.5, ki: 0.0, kd: 0.0}   
    rho:     {kp: 1.0, ki: 0.0, kd: 0.0}   
    heading: {kp: 3.0, ki: 0.0, kd: 0.0}   
    yaw:     {kp: 1.5, ki: 0.0, kd: 0.0}   
